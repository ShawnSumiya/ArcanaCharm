<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇野木ゆか - ArcanaCharm フォトギャラリー</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .member-gallery-page {
            min-height: 100vh;
            padding-top: 100px;
            position: relative;
            z-index: 1;
        }

        .member-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 0 20px;
        }

        .member-name {
            font-size: 3rem;
            color: #ff69b4;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.3);
            font-family: 'Mochiy Pop One', cursive;
        }

        .member-role {
            font-size: 1.5rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 105, 180, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-button:hover {
            background: rgba(255, 105, 180, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4);
            color: white;
            text-decoration: none;
        }

        .back-button i {
            font-size: 1rem;
        }

        .member-photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 0 20px;
            margin-bottom: 3rem;
        }

        .member-photo-item {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            background: white;
            border: 3px solid transparent;
            background-clip: padding-box;
        }

        .member-photo-item:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 25px 50px rgba(255, 105, 180, 0.3);
            border-color: #ff69b4;
        }

        .member-photo-item img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .member-photo-item:hover img {
            transform: scale(1.1);
        }

        .member-photo-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255, 105, 180, 0.8), rgba(255, 182, 193, 0.8));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .member-photo-item:hover .member-photo-overlay {
            opacity: 1;
        }

        .member-photo-overlay h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .member-photo-overlay i {
            font-size: 2rem;
        }

        /* モーダルスタイル */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
        }

        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            max-height: 80%;
            object-fit: contain;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
        }

        .modal-caption {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            text-align: center;
            color: #ccc;
            padding: 10px 0;
            height: 150px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        @media (max-width: 768px) {
            .member-name {
                font-size: 2rem;
            }
            
            .member-photos-grid {
                grid-template-columns: 1fr;
                padding: 0 15px;
            }
            
            .member-photo-item img {
                height: 350px;
                object-fit: contain;
                background-color: #f8f9fa;
            }

            .back-button {
                top: 15px;
                left: 15px;
                padding: 8px 16px;
                font-size: 0.9rem;
            }

            .modal-content {
                width: 95%;
                max-height: 70%;
            }
        }

        @media (max-width: 480px) {
            .member-photo-item img {
                height: 300px;
                object-fit: contain;
                background-color: #f8f9fa;
            }
        }
    </style>
</head>
<body>
    <!-- 戻るボタン -->
    <a href="member-selection.html" class="back-button">
        <i class="fas fa-arrow-left"></i> あるあむメンバーに戻る
    </a>

    <!-- メインコンテンツ -->
    <div class="member-gallery-page">
        <div class="container">
            <div class="member-header">
                <h1 class="member-name">宇野木ゆか</h1>
            </div>
            
            <div class="member-photos-grid" id="member-photos">
                <!-- 写真が動的に生成されます -->
            </div>
        </div>
    </div>

    <!-- 画像拡大モーダル -->
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage">
        <div class="modal-caption" id="modalCaption"></div>
    </div>

    <script src="gallery-common.js"></script>
    <script>
        // ページ読み込み時に初期化
        document.addEventListener('DOMContentLoaded', () => {
            initializeGallery('宇野木ゆか');
        });
    </script>
</body>
</html>
